# Builds the backend and frontend images and pushes them to Docker Hub
# whenever a commit lands on main.
name: Build and push Docker images

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build tag in the form YYYYMMDD-<build number>
      - id: vars
        run: echo "tag=$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Log in to Docker Hub using repo secrets
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the API image and push it as :latest and :<YYYYMMDD-build>
      - uses: docker/build-push-action@v7
        with:
          context: user-api-demo/backend
          push: true
          tags: |
            moamen800/user-api-backend:latest
            moamen800/user-api-backend:${{ steps.vars.outputs.tag }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build tag in the form YYYYMMDD-<build number>
      - id: vars
        run: echo "tag=$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Log in to Docker Hub using repo secrets
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the React image and push it as :latest and :<YYYYMMDD-build>
      - uses: docker/build-push-action@v7
        with:
          context: user-api-demo/frontend
          push: true
          tags: |
            moamen800/user-api-frontend:latest
            moamen800/user-api-frontend:${{ steps.vars.outputs.tag }}
