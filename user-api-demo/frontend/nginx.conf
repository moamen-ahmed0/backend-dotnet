server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # backend service name resolves via k8s DNS in whichever cluster/namespace
    # this frontend is deployed to, so no per-environment config is needed
    location /api/ {
        proxy_pass http://webapp-backend:8080/;
    }
}
